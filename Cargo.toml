[package]
name = "hbos-configurator"
version = "0.1.0"
edition = "2024"

[dependencies]
# Web server and async runtime
axum = "0.8"
tokio = { version = "1.0", features = ["full"] }

# CLI parsing
clap = { version = "4.0", features = ["derive"] }

# Serialization / Deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling and logging
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
tower = { version = "0.5.3", features = ["buffer", "limit"] }

# Features
alsa = "0.12" # Natives Binding zu libasound2
regex = "1.10" # Für den textbasierten amixer-Fallback falls gewünscht
tower-http = { version = "0.7.0", features = ["trace"] }
rusqlite = { version = "0.31", features = ["bundled"] }
fernet = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls"] }

[dev-dependencies]
tempfile = "3.27.0"
